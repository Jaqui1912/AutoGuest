<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes - AutoGuest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .page-header i {
            font-size: 2.5em;
            color: #f39c12;
        }

        .page-header h1 {
            font-size: 2.5em;
            color: #ffffff;
            margin: 0;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            padding: 25px;
            background-color: #2c2c2c;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-left: 5px solid transparent;
        }

        .settings-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            border-left-color: #f39c12;
        }

        .settings-icon {
            font-size: 2em;
            color: #f39c12;
            width: 50px;
            text-align: center;
            margin-right: 20px;
        }

        .settings-content {
            flex-grow: 1;
        }

        .settings-content h3 {
            font-size: 1.4em;
            margin: 0 0 5px 0;
        }

        .settings-content p {
            margin: 0;
            color: #a0a0a0;
            font-size: 0.95em;
        }

        .settings-item.danger {
            border-left-color: #e74c3c;
        }

        .settings-item.danger .settings-icon {
            color: #e74c3c;
        }

        .settings-item.danger:hover {
            border-left-color: #c0392b;
        }

        /* === Sistema de Notificaciones Unificado === */
        .notification-wrapper {
            position: relative;
            display: inline-block;
        }

        .notification-trigger {
            background: none;
            border: none;
            color: #f39c12;
            font-size: 1.6em;
            cursor: pointer;
            padding: 8px;
            position: relative;
            transition: transform 0.2s;
        }

        .notification-trigger:hover {
            transform: scale(1.1);
        }

        .notification-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.6em;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            border: 2px solid #2c2c2c;
        }

        .notification-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            width: 320px;
            background-color: #2c2c2c;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            border-radius: 12px;
            margin-top: 15px;
            z-index: 1000;
            overflow: hidden;
            animation: slideDown 0.3s ease-out;
        }

        .notification-dropdown.active {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notification-header {
            padding: 12px 15px;
            background-color: #333;
            border-bottom: 1px solid #444;
        }

        .notification-header h3 {
            margin: 0;
            font-size: 1em;
            color: #f39c12;
            text-align: left;
        }

        .notification-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .notification-item {
            padding: 12px 15px;
            border-bottom: 1 solid #3a3a3a;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }

        .notification-item:hover {
            background-color: #3a3a3a;
        }

        .notification-item.unread {
            background-color: rgba(243, 156, 18, 0.05);
            border-left: 3px solid #f39c12;
        }

        .notification-icon {
            font-size: 1.2em;
            margin-top: 2px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-content strong {
            display: block;
            font-size: 0.9em;
            color: #fff;
            margin-bottom: 2px;
        }

        .notification-content p {
            margin: 0;
            font-size: 0.8em;
            color: #aaa;
            line-height: 1.3;
        }

        .notification-time {
            display: block;
            font-size: 0.7em;
            color: #666;
            margin-top: 5px;
        }

        .notification-empty {
            padding: 30px 15px;
            text-align: center;
            color: #777;
            font-style: italic;
            font-size: 0.9em;
        }

        .text-danger { color: #e74c3c; }
        .text-warning { color: #f1c40f; }
        .text-success { color: #2ecc71; }
        .text-info { color: #3498db; }
        .text-primary { color: #f39c12; }
    </style>
</head>

<body>
    <header class="dashboard-header" style="max-width: 1200px; margin: 40px auto; padding: 15px 40px; background-color: #2c2c2c; border-radius: 12px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
        <div class="header-left" style="display: flex; align-items: center; gap: 20px;">
            <a href="dashboard_cliente.html">
                <img src="../../imagenes/Logo_Autoguest.png" alt="Logo de AutoGuest" style="height: 60px;">
            </a>
        </div>
        <div class="header-right" style="display: flex; align-items: center; gap: 20px;">
            <!-- Sistema de Notificaciones Unificado -->
            <div class="notification-wrapper">
                <button class="notification-trigger" id="notificationTrigger" onclick="NotificationSystem.toggleDropdown()">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationBadge">0</span>
                </button>
                <div class="notification-dropdown" id="notificationDropdown">
                    <div class="notification-header">
                        <h3>Notificaciones</h3>
                    </div>
                    <div class="notification-list" id="notificationList">
                        <div class="notification-empty">Cargando...</div>
                    </div>
                </div>
            </div>
            <div class="user-greeting" style="font-size: 1.1em; color: #c0c0c0; font-weight: 500;">Ajustes de Cuenta</div>
        </div>
    </header>

    <main class="page-container">
        <div class="page-header">
            <a href="dashboard_cliente.html" style="color: #f39c12; margin-right: 15px; font-size: 0.8em;"><i class="fas fa-arrow-left"></i></a>
            <i class="fas fa-cog"></i>
            <h1>Ajustes</h1>
        </div>

        <div class="settings-list">
            <a href="perfil_cliente.html" class="settings-item">
                <div class="settings-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="settings-content">
                    <h3>Mi Información Personal</h3>
                    <p>Ver y actualizar tu nombre, correo y teléfono.</p>
                </div>
                <i class="fas fa-chevron-right" style="color: #666;"></i>
            </a>


            <a href="#" class="settings-item danger" id="btnLogout">
                <div class="settings-icon">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
                <div class="settings-content">
                    <h3 style="color: #e74c3c;">Cerrar Sesión</h3>
                    <p>Desconectarse de forma segura del sistema.</p>
                </div>
            </a>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isLoggedIn') !== 'true') {
                alert('Tu sesión ha expirado. Por favor, inicia sesión de nuevo.');
                window.location.href = '../../login_cliente.html';
                return;
            }

            const btnLogout = document.getElementById('btnLogout');
            if (btnLogout) {
                btnLogout.addEventListener('click', async (e) => {
                    e.preventDefault();
                    if (confirm('¿Estás seguro de que deseas cerrar tu sesión?')) {
                        try {
                            const response = await fetch('/api/registro/logout', { method: 'POST' });
                            if (response.ok) {
                                sessionStorage.clear();
                                window.location.href = '../../index.html';
                            } else {
                                alert('Error al cerrar sesión. Inténtalo de nuevo.');
                            }
                        } catch (error) {
                            console.error('Error de red al cerrar sesión:', error);
                            alert('Error de red al cerrar sesión.');
                        }
                    }
                });
            }
        });
    </script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/global_nav.js"></script>
</body>

</html>
