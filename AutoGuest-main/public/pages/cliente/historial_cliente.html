<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pagos y Soporte - AutoGuest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 40px;
        }

        .tickets-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ticket-item {
            background-color: #2c2c2c;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            color: #fff;
        }

        .ticket-item-details {
            flex: 1;
            margin-right: 20px;
        }

        .ticket-item h4 {
            margin: 0 0 10px 0;
            color: #f39c12;
            font-size: 1.2em;
        }

        .ticket-item p {
            margin: 5px 0;
            font-size: 0.9em;
            color: #ccc;
        }

        .ticket-item span.badge {
            background: #27ae60;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8em;
            color: white;
            font-weight: bold;
        }

        .ticket-action {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 150px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-info {
            background: #3498db;
            color: #fff;
        }

        .btn-info:hover {
            background: #2980b9;
        }

        .dashboard-intro-text h1 {
            color: #fff;
            text-align: center;
        }

        /* === Sistema de Notificaciones Unificado === */
        .notification-wrapper {
            position: relative;
            display: inline-block;
        }

        .notification-trigger {
            background: none;
            border: none;
            color: #f39c12;
            font-size: 1.6em;
            cursor: pointer;
            padding: 8px;
            position: relative;
            transition: transform 0.2s;
        }

        .notification-trigger:hover {
            transform: scale(1.1);
        }

        .notification-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.6em;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            border: 2px solid #1a1a1a;
        }

        .notification-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            width: 320px;
            background-color: #2c2c2c;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            border-radius: 12px;
            margin-top: 15px;
            z-index: 1000;
            overflow: hidden;
            animation: slideDown 0.3s ease-out;
        }

        .notification-dropdown.active {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notification-header {
            padding: 12px 15px;
            background-color: #333;
            border-bottom: 1px solid #444;
        }

        .notification-header h3 {
            margin: 0;
            font-size: 1em;
            color: #f39c12;
            text-align: left;
        }

        .notification-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .notification-item {
            padding: 12px 15px;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }

        .notification-item:hover {
            background-color: #3a3a3a;
        }

        .notification-item.unread {
            background-color: rgba(243, 156, 18, 0.05);
            border-left: 3px solid #f39c12;
        }

        .notification-icon {
            font-size: 1.2em;
            margin-top: 2px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-content strong {
            display: block;
            font-size: 0.9em;
            color: #fff;
            margin-bottom: 2px;
        }

        .notification-content p {
            margin: 0;
            font-size: 0.8em;
            color: #aaa;
            line-height: 1.3;
        }

        .notification-time {
            display: block;
            font-size: 0.7em;
            color: #666;
            margin-top: 5px;
        }

        .notification-empty {
            padding: 30px 15px;
            text-align: center;
            color: #777;
            font-style: italic;
            font-size: 0.9em;
        }

        .text-danger { color: #e74c3c; }
        .text-warning { color: #f1c40f; }
        .text-success { color: #2ecc71; }
        .text-info { color: #3498db; }
        .text-primary { color: #f39c12; }
    </style>
</head>

<body>
    <header class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background-color: #1a1a1a; border-bottom: 1px solid #333;">
        <div class="header-left" style="display: flex; align-items: center; gap: 20px;">
            <a href="dashboard_cliente.html">
                <img src="../../imagenes/Logo_Autoguest.png" alt="Logo de AutoGuest" width="110" class="logo">
            </a>
        </div>
        <div class="header-right" style="display: flex; align-items: center; gap: 20px;">
            <!-- Sistema de Notificaciones Unificado -->
            <div class="notification-wrapper">
                <button class="notification-trigger" id="notificationTrigger" onclick="NotificationSystem.toggleDropdown()">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationBadge">0</span>
                </button>
                <div class="notification-dropdown" id="notificationDropdown">
                    <div class="notification-header">
                        <h3>Notificaciones</h3>
                    </div>
                    <div class="notification-list" id="notificationList">
                        <div class="notification-empty">Cargando...</div>
                    </div>
                </div>
            </div>
            <a href="dashboard_cliente.html" style="color: #c0c0c0; text-decoration: none; font-size: 15px; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-arrow-left"></i>
                <span>Volver</span>
            </a>
        </div>
    </header>

    <main>
        <section class="dashboard-container">
            <div class="dashboard-header">
                <div class="dashboard-intro-text">
                    <h1>Historial de Tickets y Soporte</h1>
                </div>
            </div>

            <div class="tickets-list" id="tickets-list">
                <!-- Tickets will be loaded here by JavaScript -->
                <p style="text-align:center; color:white;">Cargando historial...</p>
            </div>
        </section>
    </main>



    <script>
        const API_URL = '';

        document.addEventListener('DOMContentLoaded', async () => {
            const userId = sessionStorage.getItem('userId');
            const userName = sessionStorage.getItem('userName');

            if (!userId) {
                alert("Debes iniciar sesión");
                window.location.href = '../../login_cliente.html';
                return;
            }



            try {
                const res = await fetch(`${API_URL}/api/tickets`, {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token'),
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                if (res.ok) {
                    const data = await res.json();
                    const tickets = data.tickets || [];
                    const listContainer = document.getElementById('tickets-list');
                    listContainer.innerHTML = '';

                    if (tickets.length === 0) {
                        listContainer.innerHTML = '<p style="text-align:center; color:white;">No tienes tickets aún.</p>';
                        return;
                    }

                    tickets.forEach(ticket => {
                        let isPayment = ticket.asunto.includes('Comprobante de Pago');
                        let isCatalog = !!ticket.idPedido; // Si tiene idPedido es del catálogo, sino es de cita.

                        let tipoText = isCatalog ? "Pedido de Catálogo" : "Cita Taller / Servicio";
                        if (!isPayment) tipoText = "Soporte General"; // Por si usan el ticket para otra cosa

                        listContainer.innerHTML += `
                            <div class="ticket-item">
                                <div class="ticket-item-details">
                                    <h4>${ticket.idTicket} <span class="badge">${ticket.estado}</span></h4>
                                    <p><strong>Asunto:</strong> ${ticket.asunto}</p>
                                    <p><strong>Tipo:</strong> ${tipoText}</p>
                                </div>
                                <div class="ticket-action">
                                    <a href="ticket_confirmacion.html?ticket=${ticket.idTicket}&source=history" class="btn btn-info">
                                        <i class="fas fa-eye"></i> Ver Detalle PDF
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    document.getElementById('tickets-list').innerHTML = '<p style="text-align:center; color:red;">No se pudo cargar el historial.</p>';
                }
            } catch (err) {
                console.error("Error al cargar historial:", err);
            }
        });
    </script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/global_nav.js"></script>
</body>

</html>
