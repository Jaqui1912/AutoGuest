<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Servicios - Portal de Taller</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <style>
        body { background-color: #202020; }
        .portal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background-color: #1a1a1a; border-bottom: 1px solid #333; }
        .header-left { display: flex; align-items: center; gap: 25px; }
        .portal-header .logo { width: 120px; }
        .back-link { color: #c0c0c0; text-decoration: none; font-size: 15px; display: flex; align-items: center; gap: 8px; transition: color 0.3s ease; }
        .back-link:hover { color: #f39c12; }
        .header-right { text-align: right; }
        .header-right h2 { margin: 0; font-size: 1.2em; color: #ffffff; }
        .header-right p { margin: 0; font-size: 0.9em; color: #a0a0a0; }
        
        .page-container { max-width: 1300px; margin: 40px auto; padding: 0 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px;}
        .page-title { font-size: 2.2em; color: #ffffff; margin: 0; }
        
        .section-container { background-color: #2c2c2c; border-radius: 12px; padding: 30px; }
        
        /* Estilos para la tabla de servicios */
        .services-table-wrapper { overflow-x: auto; }
        .services-table { width: 100%; border-collapse: collapse; }
        .services-table th, .services-table td { padding: 15px; text-align: left; border-bottom: 1px solid #3f3f3f; }
        .services-table th { color: #a0a0a0; font-size: 0.9em; text-transform: uppercase; }
        .services-table td { color: #f0f0f0; vertical-align: middle; }
        .services-table td.price { font-weight: bold; color: #2ecc71; }
        .services-table td.description { max-width: 400px; white-space: normal; }
        
        .action-buttons { display: flex; gap: 10px; }
        .action-buttons .btn { padding: 8px 12px; font-size: 14px; width: auto; }
        .btn-danger { background-color: #e74c3c; color: white; border: 1px solid #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        /* ... debajo de .btn-danger:hover ... */

        .btn-edit { 
            background-color: #3498db; 
            color: white; 
            border: 1px solid #3498db; 
        }
        .btn-edit:hover { 
            background-color: #2980b9; 
        }

        /* ... antes de .modal-overlay ... */
        /* Estilos para el Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: #2c2c2c; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; font-size: 1.8em; color: #ffffff; }
        .close-btn { background: none; border: none; color: #a0a0a0; font-size: 24px; cursor: pointer; }

        /* === Sistema de Notificaciones === */
        .notification-wrapper {
            position: relative;
            display: inline-block;
        }

        .notification-trigger {
            background: none;
            border: none;
            color: #f39c12;
            font-size: 1.6em;
            cursor: pointer;
            padding: 8px;
            position: relative;
            transition: transform 0.2s;
        }

        .notification-trigger:hover {
            transform: scale(1.1);
        }

        .notification-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.6em;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            border: 2px solid #2c2c2c;
        }

        .notification-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            width: 320px;
            background-color: #2c2c2c;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            border-radius: 12px;
            margin-top: 15px;
            z-index: 1000;
            overflow: hidden;
            animation: slideDown 0.3s ease-out;
        }

        .notification-dropdown.active {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notification-header {
            padding: 12px 15px;
            background-color: #333;
            border-bottom: 1px solid #444;
        }

        .notification-header h3 {
            margin: 0;
            font-size: 1em;
            color: #f39c12;
        }

        .notification-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .notification-item {
            padding: 12px 15px;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .notification-item:hover {
            background-color: #3a3a3a;
        }

        .notification-item.unread {
            background-color: rgba(243, 156, 18, 0.05);
            border-left: 3px solid #f39c12;
        }

        .notification-icon {
            font-size: 1.2em;
            margin-top: 2px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-content strong {
            display: block;
            font-size: 0.9em;
            color: #fff;
            margin-bottom: 2px;
        }

        .notification-content p {
            margin: 0;
            font-size: 0.8em;
            color: #aaa;
            line-height: 1.3;
        }

        .notification-time {
            display: block;
            font-size: 0.7em;
            color: #666;
            margin-top: 5px;
        }

        .notification-empty {
            padding: 30px 15px;
            text-align: center;
            color: #777;
            font-style: italic;
            font-size: 0.9em;
        }

        .text-danger { color: #e74c3c; }
        .text-warning { color: #f1c40f; }
        .text-success { color: #2ecc71; }
        .text-info { color: #3498db; }
        .text-primary { color: #f39c12; }
    </style>
</head>
<body>
    <header class="portal-header">
        <div class="header-left">
            <a href="../../portal_taller.html"><img src="../../imagenes/Logo_Autoguest.png" alt="Logo de AutoGuest" class="logo"></a>
            <a href="../../portal_taller.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al Panel</a>
        </div>
        <div class="header-right" style="display: flex; align-items: center; gap: 20px;">
            <!-- Sistema de Notificaciones Unificado -->
            <div class="notification-wrapper">
                <button class="notification-trigger" id="notificationTrigger" onclick="NotificationSystem.toggleDropdown()">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationBadge">0</span>
                </button>
                <div class="notification-dropdown" id="notificationDropdown">
                    <div class="notification-header">
                        <h3>Notificaciones</h3>
                    </div>
                    <div class="notification-list" id="notificationList">
                        <div class="notification-empty">Cargando...</div>
                    </div>
                </div>
            </div>
            <div style="text-align: right;">
                <h2 id="tallerNameHeader" style="margin: 0; font-size: 1.1em; color: #fff;">Nombre del Taller</h2>
                <p style="margin: 0; font-size: 0.85em; color: #a0a0a0;">Administración de Servicios</p>
            </div>
        </div>
    </header>

    <main class="page-container">
        <div class="page-header">
            <h1 class="page-title">Administración de Servicios</h1>
            <button class="btn" id="addServiceBtn"><i class="fas fa-plus"></i> Añadir Nuevo Servicio</button>
        </div>

        <div class="section-container">
            <div class="services-table-wrapper">
                <table class="services-table" id="servicesTable">
                    <thead>
                        <tr>
                            <th>Nombre del Servicio</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="servicesTableBody">
                        <!-- Los servicios se cargarán aquí dinámicamente -->
                        <tr><td colspan="4">Cargando servicios...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para Añadir/Editar Servicio -->
    <div class="modal-overlay" id="serviceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Añadir Nuevo Servicio</h2>
                <button class="close-btn" id="closeModalBtn">×</button>
            </div>
            <form id="serviceForm">
                <input type="hidden" id="service-id">
                <div class="form-group">
                    <label for="service-name">Nombre del Servicio</label>
                    <input type="text" id="service-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="service-desc">Descripción</label>
                    <textarea id="service-desc" class="form-control" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="service-price">Precio</label>
                    <input type="number" id="service-price" class="form-control" step="0.01" min="0" required>
                </div>
                <button type="submit" class="btn" id="saveServiceBtn">Guardar Servicio</button>
            </form>
        </div>
    </div>

    <script src="../../js/notifications.js"></script>
    <script src="servicios-admin.js"></script>
</body>

</html>
